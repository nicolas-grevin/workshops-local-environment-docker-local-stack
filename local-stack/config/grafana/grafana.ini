[paths]
data = /var/lib/grafana
logs = /var/log/grafana
plugins = /var/lib/grafana/plugins
provisioning = conf/provisioning

[server]
protocol = http
http_port = 3000
domain = docker.localhost

[security]
disable_initial_admin_creation = false
admin_user = admin
admin_password = password

[feature_toggles]
enable = traceqlEditor tempoSearch tempoServiceGraph tempoApmTable

[explore]
enabled = true

[unified_alerting]
enabled = true

[alerting]
enabled = false
