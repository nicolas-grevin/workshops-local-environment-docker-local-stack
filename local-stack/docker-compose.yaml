services:
  traefik:
    image: "traefik:v3.4.4"
    restart: "always"
    security_opt:
      - "no-new-privileges:true"
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - "./config/traefik/:/etc/traefik/:ro"
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    networks:
      - "local-stack-vnet"

networks:
  local-stack-vnet:
    name: "local-stack-vnet"
